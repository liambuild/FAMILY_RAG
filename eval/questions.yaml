# 15 questions de référence sur eval/corpus/ (documents fictifs, voir eval/build_corpus.py).
#
# key_elements : chaque entrée doit apparaître dans la réponse (sans tenir compte de la casse ni des accents) ;
#                une sous-liste donne des variantes équivalentes (une seule suffit).
# expected_sources : chemins relatifs à eval/corpus/ (sous v1-legacy, seul le nom de base est comparé).
# known_gap : écart connu de l'audit ; l'échec n'est pas compté comme une régression.
# requires : prérequis système ; la question est ignorée (et signalée) s'il manque.
# abstain : la réponse attendue est un aveu d'ignorance ; aucune source n'est attendue.

- id: 1
  category: pdf
  question: Quelle est la franchise du contrat d'assurance habitation ?
  expected_answer: 250 euros par sinistre
  key_elements: ["250"]
  expected_sources: [assurance/contrat_habitation.pdf]

- id: 2
  category: pdf
  question: À quelle date le contrat d'assurance habitation arrive-t-il à échéance ?
  expected_answer: 31 décembre 2025
  key_elements: [["31 decembre 2025", "31/12/2025"]]
  expected_sources: [assurance/contrat_habitation.pdf]

- id: 3
  category: reformulation
  question: Combien la famille paie-t-elle chaque année pour son assurance de la maison ?
  expected_answer: 412 euros
  key_elements: ["412"]
  expected_sources: [assurance/contrat_habitation.pdf]

- id: 4
  category: docx-table
  question: Quel budget est prévu pour les vacances en 2024 ?
  expected_answer: 1800 euros (cellule d'un tableau)
  key_elements: [["1800", "1 800"]]
  expected_sources: [budget_2024.docx]
  known_gap: "F16 : les tableaux DOCX sont ignorés (lot 11)"

